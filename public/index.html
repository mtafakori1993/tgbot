<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bale Bot Tester</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px;
      background: #f4f5f7;
      font-family:
        Arial,
        "Vazirmatn",
        sans-serif;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 30px;
    }

    .section {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow:
        0 2px 10px
        rgba(0, 0, 0, .06);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 7px;
      margin-bottom: 14px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      margin: 4px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 14px;
    }

    button:hover {
      opacity: .85;
    }

    button.secondary {
      background: #666;
    }

    .messages {
      margin-top: 20px;
    }

    .message {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .message-header {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .message-text {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message img {
      display: block;
      max-width: 400px;
      max-height: 400px;
      border-radius: 10px;
      margin-top: 12px;
      cursor: pointer;
    }

    .file-card {
      display: inline-block;
      padding: 12px 15px;
      margin-top: 12px;
      border-radius: 9px;
      background: #eee;
      color: #111;
      text-decoration: none;
    }

    .audio-card {
      margin-top: 12px;
    }

    audio {
      width: 100%;
      max-width: 500px;
    }

    .caption {
      margin-top: 10px;
      color: #555;
    }

    pre {
      direction: ltr;
      text-align: left;
      background: #111;
      color: #00ff66;
      padding: 20px;
      border-radius: 10px;
      overflow: auto;
      min-height: 180px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .status {
      padding: 10px;
      background: #eee;
      border-radius: 8px;
      margin-bottom: 15px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>🤖 Bale Bot Tester</h1>


  <!-- BOT -->

  <div class="section">

    <h2>🤖 اطلاعات بازو</h2>

    <button onclick="getMe()">
      Get Me
    </button>

  </div>


  <!-- UPDATES -->

  <div class="section">

    <h2>📨 پیام‌های دریافتی</h2>

    <div class="status">
      برای دریافت پیام‌های جدید روی
      «دریافت پیام‌ها» بزن.
    </div>

    <button onclick="getUpdates()">
      🔄 دریافت پیام‌ها
    </button>

    <button
      class="secondary"
      onclick="clearMessages()"
    >
      🗑 پاک کردن
    </button>

    <div
      id="messages"
      class="messages"
    ></div>

  </div>


  <!-- SEND MESSAGE -->

  <div class="section">

    <h2>💬 ارسال پیام متنی</h2>

    <label>
      Chat ID
    </label>

    <input
      id="chatId"
      placeholder="184212180"
    >

    <label>
      متن
    </label>

    <textarea
      id="message"
      placeholder="متن پیام..."
    ></textarea>

    <label>
      Reply Message ID - اختیاری
    </label>

    <input
      id="messageReplyId"
      type="number"
      placeholder="4"
    >

    <button onclick="sendMessage()">
      📤 ارسال پیام
    </button>

  </div>


  <!-- AUDIO -->

  <div class="section">

    <h2>🎵 ارسال فایل صوتی</h2>

    <p>
      فرمت‌های مجاز:
      <strong>MP3 / M4A</strong>
      — حداکثر ۵۰MB
    </p>

    <label>
      Chat ID
    </label>

    <input
      id="audioChatId"
      placeholder="184212180"
    >

    <label>
      Caption
    </label>

    <input
      id="audioCaption"
      placeholder="توضیح فایل صوتی..."
    >

    <label>
      Reply Message ID - اختیاری
    </label>

    <input
      id="audioReplyId"
      type="number"
      placeholder="4"
    >

    <label>
      فایل صوتی
    </label>

    <input
      id="audioInput"
      type="file"
      accept=".mp3,.m4a,audio/mpeg,audio/mp4"
    >

    <button onclick="sendAudio()">
      🎵 ارسال Audio
    </button>

  </div>


  <!-- DOCUMENT -->

  <div class="section">

    <h2>📎 ارسال فایل</h2>

    <label>
      Chat ID
    </label>

    <input
      id="fileChatId"
      placeholder="184212180"
    >

    <label>
      Caption
    </label>

    <input
      id="fileCaption"
      placeholder="توضیح فایل..."
    >

    <input
      id="fileInput"
      type="file"
    >

    <button onclick="sendDocument()">
      📎 ارسال فایل
    </button>

  </div>


  <!-- RESPONSE -->

  <div class="section">

    <h2>📋 Response</h2>

    <pre id="output">Ready...</pre>

  </div>

</div>


<script>

let lastOffset = null;


// ═══════════════════════════════════════
// SHOW RESPONSE
// ═══════════════════════════════════════

function show(data) {

  const output =
    document.getElementById(
      "output"
    );

  if (typeof data === "string") {

    output.textContent =
      data;

    return;
  }

  output.textContent =
    JSON.stringify(
      data,
      null,
      2
    );

}


// ═══════════════════════════════════════
// GET ME
// ═══════════════════════════════════════

async function getMe() {

  show("Loading...");

  try {

    const response =
      await fetch(
        "/api/getMe"
      );

    const data =
      await response.json();

    show(data);

  } catch (error) {

    show({
      ok: false,
      error: error.message
    });

  }

}


// ═══════════════════════════════════════
// GET UPDATES
// ═══════════════════════════════════════

async function getUpdates() {

  show("Loading...");

  try {

    let url =
      "/api/getUpdates";

    if (lastOffset !== null) {

      url +=
        "?offset=" +
        encodeURIComponent(
          lastOffset
        );

    }

    const response =
      await fetch(url);

    const data =
      await response.json();

    show(data);

    if (
      data.ok &&
      Array.isArray(
        data.result
      )
    ) {

      renderMessages(
        data.result
      );

      if (
        data.result.length
      ) {

        const last =
          data.result[
            data.result.length - 1
          ];

        if (
          last.update_id !==
          undefined
        ) {

          lastOffset =
            last.update_id + 1;

        }

      }

    }

  } catch (error) {

    show({
      ok: false,
      error: error.message
    });

  }

}


// ═══════════════════════════════════════
// RENDER UPDATES
// ═══════════════════════════════════════

function renderMessages(
  updates
) {

  const container =
    document.getElementById(
      "messages"
    );

  for (
    const update of updates
  ) {

    const message =
      update.message;

    if (!message) {
      continue;
    }

    const div =
      document.createElement(
        "div"
      );

    div.className =
      "message";

    const firstName =
      message.from?.first_name ||
      "Unknown";

    let html = `
      <div class="message-header">
        👤 ${escapeHtml(firstName)}
        · Message #${message.message_id}
      </div>
    `;


    // ─────────────────────────
    // TEXT
    // ─────────────────────────

    if (message.text) {

      html += `
        <div class="message-text">
          ${escapeHtml(
            message.text
          )}
        </div>
      `;

    }


    // ─────────────────────────
    // PHOTO
    // ─────────────────────────

    if (
      Array.isArray(
        message.photo
      ) &&
      message.photo.length
    ) {

      const photo =
        message.photo[
          message.photo.length - 1
        ];

      html += `
        <div>
          📷 Photo
          <div>
            <strong>
              ${photo.width} × ${photo.height}
            </strong>
          </div>

          <div class="file-card">
            File ID:
            ${escapeHtml(
              photo.file_id
            )}
          </div>
        </div>
      `;

    }


    // ─────────────────────────
    // DOCUMENT
    // ─────────────────────────

    if (message.document) {

      const file =
        message.document;

      html += `
        <div class="file-card">
          📎
          ${escapeHtml(
            file.file_name ||
            "Document"
          )}

          ${
            file.file_size
              ? `
                ·
                ${formatBytes(
                  file.file_size
                )}
              `
              : ""
          }

          ${
            file.mime_type
              ? `
                ·
                ${escapeHtml(
                  file.mime_type
                )}
              `
              : ""
          }
        </div>

        <div style="margin-top:8px">
          <small>
            File ID:
            ${escapeHtml(
              file.file_id
            )}
          </small>
        </div>
      `;

    }


    // ─────────────────────────
    // AUDIO
    // ─────────────────────────

    if (message.audio) {

      const audio =
        message.audio;

      html += `
        <div class="audio-card">

          🎵
          <strong>
            ${escapeHtml(
              audio.file_name ||
              "Audio"
            )}
          </strong>

          ${
            audio.file_size
              ? `
                ·
                ${formatBytes(
                  audio.file_size
                )}
              `
              : ""
          }

          <br>

          <small>
            File ID:
            ${escapeHtml(
              audio.file_id
            )}
          </small>

        </div>
      `;

    }


    // ─────────────────────────
    // VOICE
    // ─────────────────────────

    if (message.voice) {

      const voice =
        message.voice;

      html += `
        <div class="audio-card">

          🎙 Voice

          <br>

          <small>
            File ID:
            ${escapeHtml(
              voice.file_id
            )}
          </small>

        </div>
      `;

    }


    // ─────────────────────────
    // CAPTION
    // ─────────────────────────

    if (message.caption) {

      html += `
        <div class="caption">
          💬
          ${escapeHtml(
            message.caption
          )}
        </div>
      `;

    }


    div.innerHTML =
      html;

    container.prepend(
      div
    );

  }

}


// ═══════════════════════════════════════
// SEND MESSAGE
// ═══════════════════════════════════════

async function sendMessage() {

  const chatId =
    document
      .getElementById(
        "chatId"
      )
      .value
      .trim();

  const text =
    document
      .getElementById(
        "message"
      )
      .value
      .trim();

  const replyId =
    document
      .getElementById(
        "messageReplyId"
      )
      .value
      .trim();

  if (!chatId) {
    alert(
      "Chat ID را وارد کن"
    );
    return;
  }

  if (!text) {
    alert(
      "متن پیام را وارد کن"
    );
    return;
  }

  show("Sending...");

  try {

    const body = {
      chat_id: chatId,
      text
    };

    if (replyId) {
      body.reply_to_message_id =
        Number(replyId);
    }

    const response =
      await fetch(
        "/api/sendMessage",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );

    const data =
      await response.json();

    show(data);

  } catch (error) {

    show({
      ok: false,
      error: error.message
    });

  }

}


// ═══════════════════════════════════════
// SEND AUDIO
// ═══════════════════════════════════════

async function sendAudio() {

  const chatId =
    document
      .getElementById(
        "audioChatId"
      )
      .value
      .trim();

  const caption =
    document
      .getElementById(
        "audioCaption"
      )
      .value
      .trim();

  const replyId =
    document
      .getElementById(
        "audioReplyId"
      )
      .value
      .trim();

  const input =
    document.getElementById(
      "audioInput"
    );

  const file =
    input.files[0];

  if (!chatId) {

    alert(
      "Chat ID را وارد کن"
    );

    return;
  }

  if (!file) {

    alert(
      "فایل صوتی را انتخاب کن"
    );

    return;
  }

  const filename =
    file.name.toLowerCase();

  if (
    !filename.endsWith(".mp3") &&
    !filename.endsWith(".m4a")
  ) {

    alert(
      "فقط MP3 یا M4A مجاز است"
    );

    return;
  }

  if (
    file.size >
    50 * 1024 * 1024
  ) {

    alert(
      "حداکثر حجم فایل ۵۰ مگابایت است"
    );

    return;
  }

  show(
    `Uploading ${file.name}...`
  );

  try {

    const formData =
      new FormData();

    formData.append(
      "chat_id",
      chatId
    );

    formData.append(
      "audio",
      file
    );

    if (caption) {

      formData.append(
        "caption",
        caption
      );

    }

    if (replyId) {

      formData.append(
        "reply_to_message_id",
        replyId
      );

    }

    const response =
      await fetch(
        "/api/sendAudio",
        {
          method: "POST",
          body: formData
        }
      );

    const data =
      await response.json();

    show(data);

    if (data.ok) {

      input.value = "";

    }

  } catch (error) {

    show({
      ok: false,
      error: error.message
    });

  }

}


// ═══════════════════════════════════════
// SEND DOCUMENT
// ═══════════════════════════════════════

async function sendDocument() {

  const chatId =
    document
      .getElementById(
        "fileChatId"
      )
      .value
      .trim();

  const caption =
    document
      .getElementById(
        "fileCaption"
      )
      .value
      .trim();

  const input =
    document.getElementById(
      "fileInput"
    );

  const file =
    input.files[0];

  if (!chatId) {

    alert(
      "Chat ID را وارد کن"
    );

    return;
  }

  if (!file) {

    alert(
      "یک فایل انتخاب کن"
    );

    return;
  }

  if (
    file.size >
    50 * 1024 * 1024
  ) {

    alert(
      "حداکثر حجم فایل ۵۰ مگابایت است"
    );

    return;
  }

  show(
    `Uploading ${file.name}...`
  );

  try {

    const formData =
      new FormData();

    formData.append(
      "chat_id",
      chatId
    );

    formData.append(
      "document",
      file
    );

    if (caption) {

      formData.append(
        "caption",
        caption
      );

    }

    const response =
      await fetch(
        "/api/sendDocument",
        {
          method: "POST",
          body: formData
        }
      );

    const data =
      await response.json();

    show(data);

    if (data.ok) {
      input.value = "";
    }

  } catch (error) {

    show({
      ok: false,
      error: error.message
    });

  }

}


// ═══════════════════════════════════════
// CLEAR
// ═══════════════════════════════════════

function clearMessages() {

  document.getElementById(
    "messages"
  ).innerHTML = "";

}


// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════

function formatBytes(bytes) {

  if (!bytes) {
    return "0 B";
  }

  const units = [
    "B",
    "KB",
    "MB",
    "GB"
  ];

  let i = 0;

  let size = bytes;

  while (
    size >= 1024 &&
    i < units.length - 1
  ) {

    size /= 1024;
    i++;

  }

  return (
    size.toFixed(1) +
    " " +
    units[i]
  );

}


function escapeHtml(value) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>

</body>

</html>
